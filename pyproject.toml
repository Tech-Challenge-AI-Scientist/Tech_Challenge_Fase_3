[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "tech_challenge_fase_3"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "black",
    "flake8",
    "isort",
    "pip",
    "python-dotenv",
    "pandas (>=3.0.5,<4.0.0)",
    "pathlib (>=1.0.1,<2.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.5.0,<2.0.0)",
    "joblib (>=1.4.0,<2.0.0)",
    "shap (>=0.50.0,<0.53.0)",
    "requests (>=2.34.2,<3.0.0)",
    "google-cloud-bigquery (>=3.45.1,<4.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "db-dtypes (>=1.7.1,<2.0.0)",
]
requires-python = ">=3.11,<3.15"

[tool.black]
line-length = 79
target-version = ["py310"]
include = "\\.pyi?$"
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["tech_challenge_fase_3"]
force_sort_within_sections = true


[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "flake8-bugbear (>=26.9.9,<27.0.0)",
    "flake8-comprehensions (>=3.17.0,<4.0.0)",
    "flake8-docstrings (>=1.7.0,<2.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.poetry]
package-mode = false

[tool.flake8]
max-line-length = 79
extend-ignore = [
    "E203",  # compatível com Black
    "W503",  # compatível com Black
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]